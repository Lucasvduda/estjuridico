version: "3.9"

# Stack local equivalente à infra do Render:
#   - api      : FastAPI (recebe HTTP, enfileira análises)
#   - worker   : Arq (consome fila Redis e roda análises pesadas)
#   - db       : PostgreSQL
#   - redis    : Fila + cache + bytes temporários do contrato (TTL 30 min)
#
# Use:  docker compose up --build
# Logs do worker:  docker compose logs -f worker

services:
  api:
    build: .
    container_name: legalshield-saas-api
    environment:
      - ROLE=api
      - UVICORN_WORKERS=2
      - DATABASE_URL=postgresql+asyncpg://legalshield:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@db:5432/legalshield_saas
      - REDIS_URL=redis://:${REDIS_PASSWORD:-legalshield_redis_dev}@redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CONTRACT_CACHE_TTL_SECONDS=1800
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    build: .
    container_name: legalshield-saas-worker
    environment:
      - ROLE=worker
      - DATABASE_URL=postgresql+asyncpg://legalshield:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@db:5432/legalshield_saas
      - REDIS_URL=redis://:${REDIS_PASSWORD:-legalshield_redis_dev}@redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - WORKER_CONCURRENCY=4
      - WORKER_MAX_JOBS_PER_MINUTE=60
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: legalshield-saas-db
    environment:
      POSTGRES_DB: legalshield_saas
      POSTGRES_USER: legalshield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    # NOTA: Em produção, remova o port mapping abaixo (descomente a linha seguinte)
    # Mantido para desenvolvimento local com acesso direto ao banco
    ports:
      - "5432:5432"
    # ports: []  # <- Usar isto em produção
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legalshield"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: legalshield-saas-redis
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--requirepass", "${REDIS_PASSWORD:-legalshield_redis_dev}"]
    # NOTA: Em produção, remova o port mapping abaixo
    # Mantido para desenvolvimento local
    ports:
      - "6379:6379"
    # ports: []  # <- Usar isto em produção
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
