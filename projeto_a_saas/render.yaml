# LegalShield AI — Blueprint Render (Infrastructure-as-Code)
#
# PLANO: TESTE (gratuito/mínimo) — upgrade depois pelo painel do Render
#
# Para escalar, basta trocar os planos no painel do Render:
#   - API:    free → starter ($7) → standard ($25, com autoscaling)
#   - Worker: starter ($7) → standard ($25, com autoscaling)
#   - DB:     free → basic ($7) → standard ($20)
#   - Redis:  free → starter ($10) → standard ($30)
#
# Cria:
#   - legalshield-api      : Web Service (FastAPI)
#   - legalshield-worker   : Background Worker (Arq)
#   - legalshield-db       : Postgres gerenciado
#   - legalshield-redis    : Redis (fila + referências R2)
#   - legalshield-secrets  : Env Group com segredos compartilhados

# ---------------------------------------------------------------------------
# Env Group compartilhado
# ---------------------------------------------------------------------------
# Segredos (OPENAI_API_KEY, ENCRYPTION_MASTER_KEY, etc.) devem ser
# adicionados MANUALMENTE no painel do Render em cada serviço.
# NÃO colocar no render.yaml para evitar reset a cada git push.

databases:
  - name: legalshield-db
    databaseName: legalshield_saas
    user: legalshield
    plan: free                    # grátis (90 dias, depois upgrade para basic $7)
    region: oregon                # free só disponível em oregon

services:
  # ---------------------------------------------------------------------------
  # API Web (FastAPI / Uvicorn)
  # ---------------------------------------------------------------------------
  - type: web
    name: legalshield-api
    runtime: docker
    region: oregon                # free só disponível em oregon
    plan: free                    # grátis (dorme após 15 min sem uso, acorda ao acessar)
    rootDir: projeto_a_saas
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ROLE
        value: api
      - key: UVICORN_WORKERS
        value: "1"                # 1 worker para plano free (menos memória)
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: STORAGE_BACKEND
        value: redis

      - key: DATABASE_URL
        fromDatabase:
          name: legalshield-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: legalshield-redis
          property: connectionString

      - key: CONTRACT_CACHE_TTL_SECONDS
        value: "1800"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ENCRYPTION_MASTER_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false

      - key: LLM_PRIMARY_MODEL
        value: openai/gpt-4o
      - key: LLM_FALLBACK_MODEL
        value: anthropic/claude-sonnet-4-5
      - key: LLM_MAX_TOKENS
        value: "4096"
      - key: LLM_TEMPERATURE
        value: "0.1"

      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "3"

      - key: RATE_LIMIT_REQUESTS_PER_MINUTE
        value: "60"
      - key: RATE_LIMIT_ANALYSES_PER_HOUR
        value: "20"
      - key: MAX_FILE_SIZE_MB
        value: "10"               # menor para plano free (economiza memória)

  # ---------------------------------------------------------------------------
  # Worker Background (Arq)
  # ---------------------------------------------------------------------------
  - type: worker
    name: legalshield-worker
    runtime: docker
    region: oregon
    plan: starter                 # $7/mês — worker não tem plano free no Render
    rootDir: projeto_a_saas
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: ROLE
        value: worker
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: STORAGE_BACKEND
        value: redis

      - key: DATABASE_URL
        fromDatabase:
          name: legalshield-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: legalshield-redis
          property: connectionString

      - key: CONTRACT_CACHE_TTL_SECONDS
        value: "1800"
      - key: OPENAI_API_KEY
        sync: false
      - key: ENCRYPTION_MASTER_KEY
        sync: false

      - key: WORKER_CONCURRENCY
        value: "2"                # menos concorrência para plano starter
      - key: WORKER_MAX_JOBS_PER_MINUTE
        value: "30"
      - key: WORKER_JOB_TIMEOUT
        value: "600"

      - key: LLM_PRIMARY_MODEL
        value: openai/gpt-4o
      - key: LLM_FALLBACK_MODEL
        value: anthropic/claude-sonnet-4-5
      - key: LLM_MAX_TOKENS
        value: "4096"
      - key: LLM_TEMPERATURE
        value: "0.1"

      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"

  # ---------------------------------------------------------------------------
  # Redis (Key Value)
  # ---------------------------------------------------------------------------
  - type: redis
    name: legalshield-redis
    region: oregon
    plan: free                    # grátis (25 MB — suficiente com R2 para bytes)
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
